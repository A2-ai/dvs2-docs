[project]
name = "demo_dvs2_rpkg"
r_version = "4.5"

# A list of repositories to fetch packages from. Order matters: we will try to get a package from each repository in order.
# The alias is only used in this file if you want to specifically require a dependency to come from a certain repository.
# Example: { alias = "PPM", url = "https://packagemanager.posit.co/cran/latest" },
repositories = [
    #{alias = "PRISM", url = "https://prism.a2-ai.cloud/rpkgs/nimbus/2025.08/"},
    {alias = "PRISM", url = "https://prism.a2-ai.cloud/rpkgs/nimbus/2026.03/"},
]

# A list of packages to install and any additional configuration
# Examples:
    # "dplyr",
    # {name = "dplyr", repository = "CRAN"},
    # {name = "dplyr", git = "https://github.com/tidyverse/dplyr.git", tag = "v1.1.4"},
dependencies = [
    "quarto",
    # dvs at the dvs2 commit the vignettes are rendered against, built from
    # source: needs Rust and rv newer than 0.22.2 (git dependencies with a
    # `directory`). `just install-cli` builds the dvs CLI from the commit
    # rv.lock records, and `just update-dvs` moves both to the tip of dvs2 main.
    { name = "dvs", git = "https://github.com/A2-ai/dvs2", commit = "7ff0aa0300a108197ecbc8bbb287c7a1cf34f54a", directory = "dvs-rpkg" },
    "usethis",
    "here",
    "stringr",
    "dplyr",
    "fs",
    "jsonlite",
]
